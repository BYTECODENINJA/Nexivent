services:
  #=============================================
  # INFRASTRUCTURE
  #=============================================

  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: nexivent-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@nexivent-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://nexivent-kafka:29092,CONTROLLER://nexivent-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://nexivent-kafka:29092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9093:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexivent-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nexivent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: nexivent-kafka:29092
    ports:
      - "8080:8080"

  # PostgreSql database:
  postgres:
    image: postgres:16-alpine
    container_name: nexivent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexivent
      POSTGRES_PASSWORD: nexivent_password
      POSTGRES_DB: nexivent
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis Caching
  redis:
    image: redis:7-alpine
    container_name: nexivent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # MailHog
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexivent-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  kafka-data:
  postgres-data:
  redis-data: